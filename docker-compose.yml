services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=tiktok_live_monitor
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql
    # Lets `backend` actually wait until Postgres accepts connections, not
    # just until the container process has started (the old `depends_on: -
    # db` with no condition only guaranteed the latter -- a real source of
    # "ECONNREFUSED on first request" races on a fresh `docker compose up`).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tiktok_live_monitor"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - DATABASE_URL=postgres://postgres:postgres@db:5432/tiktok_live_monitor
      # Raises the WebSocket-signing rate limit above tiktok-live-connector's
      # shared anonymous pool (see backend/src/services/liveStream.service.js).
      # Read from a `.env` file at the repo root (NOT backend/.env, which
      # only dotenv inside the Node process reads) or from the shell
      # environment; left blank falls back to the anonymous pool.
      - EULER_API_KEY=${EULER_API_KEY:-}
      # NFR-SEC-04/06: required -- backend refuses to start without it. Set it
      # in the repo-root `.env` or the shell (see backend/.env.example).
      - USER_ID_PEPPER=${USER_ID_PEPPER:?USER_ID_PEPPER must be set}
      # NFR-SEC-01/02: auth secrets. Without them /api/auth/login and
      # /api/auth/game-token answer 500 "chưa cấu hình", so they are required.
      - ADMIN_USERNAME=${ADMIN_USERNAME:-operator}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - GAME_CLIENT_SECRET=${GAME_CLIENT_SECRET:?GAME_CLIENT_SECRET must be set}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-8h}
      - GAME_TOKEN_EXPIRES_IN=${GAME_TOKEN_EXPIRES_IN:-24h}
      # NFR-SEC-04: days of per-viewer data kept by the daily retention job (0 = disabled).
      - RETENTION_DAYS=${RETENTION_DAYS:-30}
      # Browser origins allowed by CORS (REST + Socket.IO); must include the frontend URL below.
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      - AUTH_MAX_FAILURES=${AUTH_MAX_FAILURES:-5}
      - AUTH_LOCKOUT_MINUTES=${AUTH_LOCKOUT_MINUTES:-15}
      # FR-40: set LOG_LEVEL=debug here to increase verbosity when troubleshooting.
      - LOG_LEVEL=info
    depends_on:
      db:
        condition: service_healthy
    # Node is already guaranteed present in this image, so the healthcheck
    # needs no extra package (node:alpine ships neither curl nor wget).
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:5000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:5000}
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  db_data:
